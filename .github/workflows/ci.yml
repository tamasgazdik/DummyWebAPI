name: .NET CI
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/NuGet.config', '**/Directory.Build.props', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # setup SonarQube
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path ${{ runner.temp }}/scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      # build the .NET application with SonarQube analysis
      - name: Install dotnet-coverage
        run: |
          mkdir -p ${{ runner.temp }}/tools
          dotnet tool install dotnet-coverage --tool-path ${{ runner.temp }}/tools

      - name: Build, test and analyze with SonarQube
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin \
            /k:"tamasgazdik_DummyWebAPI" \
            /o:"tamasgazdik" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml \
            /d:sonar.coverage.exclusions="**/*.xml,**/*.json,**/*.yml,**/*.yaml,**/Program.cs
          
          dotnet build --configuration Release --no-restore
          
          ${{ runner.temp }}/tools/dotnet-coverage collect \
            'dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults --verbosity normal' \
            -f xml \
            -o coverage.xml

          ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Publish
        run: dotnet publish ./Source/DummyWebAPI/DummyWebAPI.csproj --configuration Release --no-build --output ./publish

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: DummyWebAPI
          path: ./publish

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DummyWebAPITests
          path: ./TestResults
          if-no-files-found: ignore
